<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <style>
      body {
        background-color: bisque;
        padding: 0;
        margin: 0;
        height: 100vh;
        display: flex;
        align-content: center;

        justify-content: center;
        align-items: center;
      }
      .card {
        background-color: burlywood;
        border-radius: 8px;
        padding: 30px;
        width: 450px;
      }
      h1 {
        color: rgb(51, 114, 116);
        text-align: center;
        margin-bottom: 30px;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      input {
        padding: 10px;
        border-radius: 5px;
        background-color: rgb(194, 238, 239);
        border: 1px solid black;
      }
      button {
        background-color: rgb(114, 114, 236);
        padding: 10px;
        border-radius: 8px;
      }
      button:hover {
        background-color: rgb(40, 40, 112);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Login</h1>

      <form>
        <input type="email" name="" id="" placeholder="Email" />
        <input type="password" name="" id="" placeholder="Password" />

        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
