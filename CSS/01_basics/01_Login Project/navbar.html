<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <style>
        body{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #92f6d1;
            color: aliceblue;

        }
        .nav-container{
            margin-bottom: 30px;


        }
        h2{
            margin-bottom: 30px;
        }
        .nav1{
           
           background-color: bisque;
           padding: 10px; 
           display: flex;
           justify-content: space-between;
           margin: 0;
           
        }
        .nav1 ul{
          display: flex;
          justify-content: space-between;


        }
        .nav1 li {
          display: inline;  
        }
        .nav1 a{
            text-decoration: none;
            color: rgb(110, 59, 211);
            padding: 5px 10px;
            
            position: relative;
            cursor: crosshair;
            position: relative;
        }
        .nav1 a::after{
            content: "Nice Choice";
            position: absolute;
            height: 2px;
            width: 100%;
            bottom: 0;
            left: 0;
            background-color: blueviolet;
            transform: scaleX(0);
            transition: transform 0.3s ease-in-out;
            


        }
        .nav1 a:hover::after{
            transform: scaleX(1);
            

        }
        .nav2{
          border: 2px solid red;
          background-color: bisque;  
          width: 200px;
          padding: 20px;
          
        }
        .nav2 ul {
            list-style-type: none;
            margin: 0;
            padding: 0;


        }
        .nav2 li{
            margin-bottom: 12px;

        }
        .nav2 a {
            text-decoration: none;
            color: rgb(209, 141, 38);
            display: block;
            padding: 10px;
            width: 100%;
        }
        .nav2 a:hover{
            background-color: rgb(94, 226, 182);

        }
        .nav2 .Login-Button{
            background-color: rgb(8, 74, 77);
            color: rgb(138, 138, 13);
            border: none;
            width: 100%;
            padding: 10px;
            cursor: pointer;
            margin-left: 5px;

        }
        .nav2 .Login-Button:hover{
            background-color: rgb(39, 205, 150);
            border: 1px solid white;
        }
        .nav3{
            background-color: bisque;
            padding: 10px;

        }
        .nav3 ul{
          list-style-type: none;  
          padding: 0;
          margin: 0;
          display: flex;
          justify-content: space-around;
          align-items: center;
        }
        .nav3 a{
            text-decoration: none;
            color: aqua;
            padding: 10px;
            display: block;


          
        }
        .nav3 .dropdown-content{
            display: none;
            
        }
        .nav3 .dropdown:hover .dropdown-content{
            display: block;
            position: absolute;
            background-color: bisque;
            color: yellow;
        }

        
    </style>
</head> 
<body>
    <div class="nav-container">
        <h2>Varition 1 : Horizontal with Underline Effect</h2>
        <nav class="nav1"
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Products</a></li>
        
        </ul>
        </div>
    </nav>
        

    <div class="nav-container">

    
    <h2>Varition 2: Verticle with hover effect</h2>
    <nav class="nav2">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Products</a></li>
            <li><button class="Login-Button">Login</button></button></li>

        </ul>
        
    </nav>
    </div>

    <div class="nav-container">

    
    <h2>Varition 3: Dropdown Bar</h2>
    <nav class="nav3">
        <ul>
            <li><a href="#">Home</a></li>
            <li class="dropdown">
                <a href="#">About</a>
                
                <div class="dropdown-content">
                    <a href="#">Our Story</a>
                    <a href="#">Saved Lives</a>
                    <a href="#">Meet The Champs</a>
                    </div>

                
                </li>
                <li><a href="#">Products</a></li><button class="Login-btn">Login</button></li>
                
        </ul>
        
    </nav>
    </div>
    
</body>
</html>
