<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome Here</title>
    <style>
      body {
        background-color: #bc7b7b;
        padding: 0;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        justify-items: center;
      }
      .card {
        background-color: bisque;
        width: 450px;
        border-radius: 8px;
        padding: 30px;
      }
      h1 {
        text-align: center;
        margin-bottom: 30px;
        color: aqua;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      button {
        border-radius: 8px;
        padding: 30px;
        background-color: rgb(50, 225, 152);
      }
      button:hover {
        background-color: rgb(145, 230, 8);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <form>
        <input type="Name" name="Name" id="" placeholder="Name" />
        <input type="email" name="Email" id="" placeholder="Email" />
        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
