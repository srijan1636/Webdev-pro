<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Jungle Gym</title>

    <style>
      body {
        background-color: antiquewhite;
        padding: 0;
        margin: 0;
        height: 100vh;
        display: flex;
        align-content: center;
        align-items: center;
        justify-content: center;
      }
      .card {
        background-color: rgb(255, 201, 109);
        width: 450px;
        border-radius: 8px;
        padding: 30px;
      }
      h1 {
        text-align: center;
        margin-bottom: 30px;
        color: cadetblue;
      }
      input {
        padding: 10px;
        border-radius: 8px;
      }
      button {
        border-radius: 8px;
        padding: 30px;
        background-color: rgb(50, 225, 152);
      }
      button:hover {
        background-color: rgb(145, 230, 8);
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Welcome To Jungle Gym</h1>
      <form>
        <input type="email" name="Email" id="" placeholder="Email" />
        <input type="password" name="Pswd" id="" placeholder="Pswd" />
        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
